# NAV-015：D435 深度体素层。由 depth_layer_supervisor 动态启用，启动默认仅激光。
controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.10
      max_speed_xy: 0.10
      acc_lim_x: 0.20
      decel_lim_x: -0.20
      sim_time: 2.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.10, 0.0, 0.45]
    min_velocity: [-0.05, 0.0, -0.45]
    max_accel: [0.20, 0.0, 0.80]
    max_decel: [-0.20, 0.0, -0.80]

local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [obstacle_layer, depth_voxel_layer, inflation_layer]
      depth_voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: false
        combination_method: 1
        publish_voxel_map: true
        footprint_clearing_enabled: true
        origin_z: 0.0
        z_resolution: 0.02
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 1
        max_obstacle_height: 0.26
        observation_sources: depth_mark depth_clear
        depth_mark:
          topic: /camera/navigation/obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.03
          max_obstacle_height: 0.26
          obstacle_min_range: 0.30
          obstacle_max_range: 2.00
          observation_persistence: 0.0
          expected_update_rate: 0.0
        depth_clear:
          topic: /camera/navigation/clearing
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          raytrace_min_range: 0.30
          raytrace_max_range: 2.00
          observation_persistence: 0.0
          expected_update_rate: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: [static_layer, obstacle_layer, depth_voxel_layer, inflation_layer]
      depth_voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: false
        combination_method: 1
        publish_voxel_map: true
        footprint_clearing_enabled: true
        origin_z: 0.0
        z_resolution: 0.02
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 1
        max_obstacle_height: 0.26
        observation_sources: depth_mark depth_clear
        depth_mark:
          topic: /camera/navigation/obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.03
          max_obstacle_height: 0.26
          obstacle_min_range: 0.30
          obstacle_max_range: 2.00
          observation_persistence: 0.0
          expected_update_rate: 0.0
        depth_clear:
          topic: /camera/navigation/clearing
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          raytrace_min_range: 0.30
          raytrace_max_range: 2.00
          observation_persistence: 0.0
          expected_update_rate: 0.0
