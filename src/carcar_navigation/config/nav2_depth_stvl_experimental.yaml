# STVL 主线实验参数，记忆期限及低障碍范围均待实机验收。参数修改后重启。
controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.1
      max_speed_xy: 0.1
      acc_lim_x: 0.2
      decel_lim_x: -0.2
      sim_time: 2.0
velocity_smoother:
  ros__parameters:
    max_velocity:
    - 0.1
    - 0.0
    - 0.45
    min_velocity:
    - -0.05
    - 0.0
    - -0.45
    max_accel:
    - 0.2
    - 0.0
    - 0.8
    max_decel:
    - -0.2
    - 0.0
    - -0.8
local_costmap:
  local_costmap:
    ros__parameters:
      plugins:
      - obstacle_layer
      - depth_stvl
      - inflation_layer
      depth_stvl:
        plugin: carcar_navigation::MonitoredStvlLayer
        enabled: true
        voxel_decay: 2.0
        decay_model: 0
        voxel_size: 0.02
        mark_threshold: 1
        track_unknown_space: false
        combination_method: 1
        update_footprint_enabled: true
        publish_voxel_map: true
        mapping_mode: false
        transform_tolerance: 0.1
        max_obstacle_height: 0.26
        observation_sources: depth_near depth_regular
        depth_near:
          topic: /camera/navigation/obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.015
          max_obstacle_height: 0.26
          obstacle_range: 0.85
          expected_update_rate: 0.5
          observation_persistence: 0.0
          clear_after_reading: true
          filter: passthrough
        depth_regular:
          topic: /camera/navigation/obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.05
          max_obstacle_height: 0.26
          obstacle_range: 2.0
          expected_update_rate: 0.5
          observation_persistence: 0.0
          clear_after_reading: true
          filter: passthrough
      update_frequency: 5.0
      publish_frequency: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      plugins:
      - static_layer
      - obstacle_layer
      - depth_stvl
      - inflation_layer
      depth_stvl:
        plugin: carcar_navigation::MonitoredStvlLayer
        enabled: true
        voxel_decay: 5.0
        decay_model: 0
        voxel_size: 0.02
        mark_threshold: 1
        track_unknown_space: true
        combination_method: 1
        update_footprint_enabled: true
        publish_voxel_map: true
        mapping_mode: false
        transform_tolerance: 0.1
        max_obstacle_height: 0.26
        observation_sources: depth_near depth_regular
        depth_near:
          topic: /camera/navigation/obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.015
          max_obstacle_height: 0.26
          obstacle_range: 0.85
          expected_update_rate: 0.5
          observation_persistence: 0.0
          clear_after_reading: true
          filter: passthrough
        depth_regular:
          topic: /camera/navigation/obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.05
          max_obstacle_height: 0.26
          obstacle_range: 2.0
          expected_update_rate: 0.5
          observation_persistence: 0.0
          clear_after_reading: true
          filter: passthrough
      update_frequency: 3.0
      publish_frequency: 3.0
navigation_motion_gate:
  ros__parameters:
    require_perception_health: true
    perception_timeout: 0.3

bt_navigator:
  ros__parameters:
    recovery.require_perception_health: true
