# 1 秒线性衰减静止候选；仅 voxel_decay 与 2 秒基线不同，不用于移动导航。
/**:
  ros__parameters:
    use_sim_time: false
    global_frame: base_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    update_frequency: 5.0
    publish_frequency: 5.0
    rolling_window: true
    width: 4
    height: 4
    resolution: 0.02
    track_unknown_space: false
    footprint: '[[-0.14, -0.13], [-0.14, 0.13], [0.14, 0.13], [0.14, -0.13]]'
    footprint_padding: 0.01
    plugins:
    - depth_stvl
    - inflation_layer
    always_send_full_costmap: true
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      enabled: true
      inflation_radius: 0.2
      cost_scaling_factor: 5.0
    lifetime_plugins:
    - carcar_navigation::MonitoredStvlLayer
    depth_stvl:
      plugin: carcar_navigation::MonitoredStvlLayer
      enabled: true
      voxel_decay: 1.0
      decay_model: 0
      voxel_size: 0.02
      mark_threshold: 1
      track_unknown_space: false
      combination_method: 1
      update_footprint_enabled: true
      publish_voxel_map: true
      mapping_mode: false
      transform_tolerance: 0.1
      max_obstacle_height: 0.26
      observation_sources: depth_near depth_regular
      depth_near:
        topic: /camera/navigation/obstacles
        data_type: PointCloud2
        marking: true
        clearing: false
        min_obstacle_height: 0.015
        max_obstacle_height: 0.26
        obstacle_range: 0.85
        expected_update_rate: 0.5
        observation_persistence: 0.0
        clear_after_reading: true
        filter: passthrough
      depth_regular:
        topic: /camera/navigation/obstacles
        data_type: PointCloud2
        marking: true
        clearing: false
        min_obstacle_height: 0.05
        max_obstacle_height: 0.26
        obstacle_range: 2.0
        expected_update_rate: 0.5
        observation_persistence: 0.0
        clear_after_reading: true
        filter: passthrough
