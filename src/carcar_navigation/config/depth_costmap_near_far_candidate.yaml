# 独立诊断的Humble 1.1.20近低/远高双标障源候选；共享同一个点云话题。
# 近路0.30～0.85 m/1.5 cm，远路0.85～2 m/5 cm；范围是光心斜距。
# 阈值与远路可靠性尚待实测；不能取代全区域2 cm障碍覆盖。
/**:
  ros__parameters:
    use_sim_time: false
    global_frame: base_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    update_frequency: 5.0
    publish_frequency: 2.0
    rolling_window: true
    width: 4
    height: 4
    resolution: 0.02
    track_unknown_space: false
    footprint: "[[-0.14, -0.13], [-0.14, 0.13], [0.14, 0.13], [0.14, -0.13]]"
    footprint_padding: 0.01
    plugins: [depth_voxel_layer, inflation_layer]
    always_send_full_costmap: true
    depth_voxel_layer:
      plugin: nav2_costmap_2d::VoxelLayer
      enabled: true
      combination_method: 1
      publish_voxel_map: true
      footprint_clearing_enabled: true
      origin_z: 0.0
      z_resolution: 0.02
      z_voxels: 16
      unknown_threshold: 15
      mark_threshold: 0
      max_obstacle_height: 0.26
      observation_sources: depth_near_mark depth_far_mark depth_clear
      depth_near_mark:
        topic: /camera/navigation/obstacles
        data_type: PointCloud2
        marking: true
        clearing: false
        min_obstacle_height: 0.015
        max_obstacle_height: 0.26
        obstacle_min_range: 0.30
        obstacle_max_range: 0.85
        observation_persistence: 0.0
        expected_update_rate: 0.0
      depth_far_mark:
        topic: /camera/navigation/obstacles
        data_type: PointCloud2
        marking: true
        clearing: false
        min_obstacle_height: 0.05
        max_obstacle_height: 0.26
        obstacle_min_range: 0.85
        obstacle_max_range: 2.00
        observation_persistence: 0.0
        expected_update_rate: 0.0
      depth_clear:
        topic: /camera/navigation/clearing
        data_type: PointCloud2
        marking: false
        clearing: true
        min_obstacle_height: -0.30
        max_obstacle_height: 2.0
        raytrace_min_range: 0.30
        raytrace_max_range: 2.00
        observation_persistence: 0.0
        expected_update_rate: 0.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      enabled: true
      inflation_radius: 0.20
      cost_scaling_factor: 5.0
