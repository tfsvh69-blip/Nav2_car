# NAV-012 实验覆盖参数（小车墙角绕行与受阻脱困改进基线）。
# 本文件必须与 config/nav2.yaml 一起加载，后者仍是当前稳定对照配置。
# 所有值都只在实车验收前作为实验值使用。

bt_navigator:
  ros__parameters:
    recovery.response_timeout: 1.0
    recovery.cancel_timeout: 1.0
    recovery.settle_timeout: 2.0
    recovery.still_duration: 1.0
    recovery.max_data_age: 0.5
    recovery.total_timeout: 90.0

amcl:
  ros__parameters:
    update_min_a: 0.05
    update_min_d: 0.05
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    failure_tolerance: 2.0
    progress_checker_plugin: progress_checker
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.20
      movement_time_allowance: 20.0
    controller_plugins: [FollowPath]
    FollowPath:
      # NAV-012 套餐 A: 引入本机自带的 RotationShimController 包装 DWB
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      # Rotation Shim 参数基线
      angular_dist_threshold: 0.60          # 触发起步对向角偏差 (~34.4°)
      angular_disengage_threshold: 0.25     # 退出起步对向角偏差 (~14.3°)
      forward_sampling_distance: 0.30       # 路线前向采样距离 (m)
      rotate_to_heading_angular_vel: 0.30   # 起步对向角速度 (rad/s)
      max_angular_accel: 0.80               # 转向角加速度 (rad/s²)
      simulate_ahead_time: 2.0              # 转向预测时间 (s)，旋转前校验扫掠包络
      rotate_to_goal_heading: false         # 终点调向由 DWB RotateToGoal 处理

      # 被包装的 DWB 本地规划器参数 (统一 0.12 m/s 低速基线)
      debug_trajectory_details: true
      transform_tolerance: 0.3
      min_vel_x: 0.0
      max_vel_x: 0.12
      min_vel_y: 0.0
      max_vel_y: 0.0
      min_speed_xy: 0.0
      max_speed_xy: 0.12
      max_vel_theta: 0.60
      min_speed_theta: 0.0
      sim_time: 2.0
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 12.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 10.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 12.0
      RotateToGoal.slowing_factor: 2.5
      publish_evaluation: true
      publish_local_plan: true
      publish_trajectories: true

local_costmap:
  local_costmap:
    ros__parameters:
      # 提升发布频率至 5Hz，消除恢复节点与行为树读取代价地图延迟
      update_frequency: 5.0
      publish_frequency: 5.0
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.14, -0.13], [-0.14, 0.13], [0.14, 0.13], [0.14, -0.13]]"
      inflation_layer:
        enabled: true
        cost_scaling_factor: 5.0
        inflation_radius: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[-0.14, -0.13], [-0.14, 0.13], [0.14, 0.13], [0.14, -0.13]]"
      inflation_layer:
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    velocity_timeout: 0.30
    max_velocity: [0.12, 0.0, 0.60]
    # 正常 DWB 仍只采样前进速度；-0.05 供 ProtectedBackUp 恢复使用
    min_velocity: [-0.05, 0.0, -0.60]
    max_accel: [0.20, 0.0, 0.80]
    max_decel: [-0.20, 0.0, -0.80]

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    # NAV-012 套餐 B: 替换为带实时激光新鲜度与后方扇区防撞守护的 ProtectedBackUp
    backup:
      plugin: carcar_navigation/ProtectedBackUp
    wait:
      plugin: nav2_behaviors/Wait
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.30
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.80

lifecycle_manager_navigation:
  ros__parameters:
    node_names: ['controller_server', 'velocity_smoother', 'planner_server', 'behavior_server', 'bt_navigator']
