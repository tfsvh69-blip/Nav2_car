# NAV-015-P2A：只验收静止深度标障/清障，不能作为移动导航参数。
# 以 base_footprint 为固定参考，复用真实相机 TF，不生成模拟 odom/map。
# 2026-09-27 用户要求：独立静止测试默认开启深度层，重启无需手动启用。
/**:
  ros__parameters:
    use_sim_time: false
    global_frame: base_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    update_frequency: 5.0
    publish_frequency: 2.0
    rolling_window: true
    width: 4
    height: 4
    resolution: 0.02
    track_unknown_space: false
    footprint: "[[-0.14, -0.13], [-0.14, 0.13], [0.14, 0.13], [0.14, -0.13]]"
    footprint_padding: 0.01
    plugins: [depth_voxel_layer, inflation_layer]
    always_send_full_costmap: true
    depth_voxel_layer:
      plugin: nav2_costmap_2d::VoxelLayer
      enabled: true
      combination_method: 1
      publish_voxel_map: true
      footprint_clearing_enabled: true
      origin_z: 0.0
      z_resolution: 0.02
      z_voxels: 16
      unknown_threshold: 15
      mark_threshold: 1
      max_obstacle_height: 0.26
      observation_sources: depth_mark depth_clear
      depth_mark:
        topic: /camera/navigation/obstacles
        data_type: PointCloud2
        marking: true
        clearing: false
        min_obstacle_height: 0.03
        max_obstacle_height: 0.26
        obstacle_min_range: 0.30
        obstacle_max_range: 2.00
        observation_persistence: 0.0
        expected_update_rate: 0.0
      depth_clear:
        topic: /camera/navigation/clearing
        data_type: PointCloud2
        marking: false
        clearing: true
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        raytrace_min_range: 0.30
        raytrace_max_range: 2.00
        observation_persistence: 0.0
        expected_update_rate: 0.0
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      enabled: true
      inflation_radius: 0.20
      cost_scaling_factor: 5.0
