# NAV-012-R10：同速度对照组。仅作为最终覆盖加载，不替换稳定配置。
# 同一文件也由 robot.launch.xml 的 speed_params_file 加载以对齐底盘上限。
rosmaster_base:
  ros__parameters:
    max_linear_x: 0.18
controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.18
      max_speed_xy: 0.18
      ObstacleFootprint.scale: 0.03
velocity_smoother:
  ros__parameters:
    max_velocity: [0.18, 0.0, 0.80]
local_costmap:
  local_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.20
