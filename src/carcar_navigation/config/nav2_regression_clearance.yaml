# NAV-012-R10：弯角净空候选，尚未实车验收。
# 与 baseline 同速度；只额外调整局部膨胀半径和障碍评分权重。
rosmaster_base:
  ros__parameters:
    max_linear_x: 0.18
controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.18
      max_speed_xy: 0.18
      ObstacleFootprint.scale: 0.15
velocity_smoother:
  ros__parameters:
    max_velocity: [0.18, 0.0, 0.80]
local_costmap:
  local_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.30
