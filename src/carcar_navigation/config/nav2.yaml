# NAV-003: 静态地图定位与低速单点导航参数配置
# 适配模型：四轮麦克纳姆底盘退化之非全向差速模型（holonomic=false，禁用横移与倒车）
# 状态估计：纯轮式里程计（ODOM-001），不接入 IMU/EKF

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 3.00
    laser_min_range: 0.10
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # 严格锁定差速运动模型，禁止全向运动假设
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.10
    update_min_d: 0.10
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
    # 每次实机启动均由操作员在 RViz 中设置真实初始位姿，避免默认原点被误当作定位结果。
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /wheel/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    # 导航行为树：单目标与多目标周期重规划跟随（无自转/无倒车/无代价地图清除恢复）
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /wheel/odometry
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # 首轮安全验收：10 秒内未移动 0.10 m 即中止任务并由速度链路停车。
      required_movement_radius: 0.10
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # 目标容差设为 0.15 m / 10° (0.175 rad)
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.175
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      # 严格差速非全向：禁止倒车，禁止横移
      min_vel_x: 0.0
      # NAV-003 实车调参：速度上限由 0.10 m/s 提高 1.8 倍，用于克服带载静摩擦。
      max_vel_x: 0.18
      min_vel_y: 0.0
      max_vel_y: 0.0
      # 原地旋转上限由 0.20 rad/s 提高 1.8 倍；正负方向保持严格对称。
      max_vel_theta: 0.36
      min_speed_xy: 0.0
      max_speed_xy: 0.18
      min_speed_theta: 0.0
      # 实机待调的保守初始加减速度。
      acc_lim_x: 0.20
      acc_lim_y: 0.0
      acc_lim_theta: 0.40
      decel_lim_x: -0.20
      decel_lim_y: 0.0
      decel_lim_theta: -0.40
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 2.5
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 首轮保留保守矩形安全包络 x=±0.20 m, y=±0.17 m（实车 0.235x0.216 m）
      footprint: "[[-0.20, -0.17], [-0.20, 0.17], [0.20, 0.17], [0.20, -0.17]]"
      footprint_padding: 0.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.00
          raytrace_min_range: 0.10
          obstacle_max_range: 3.00
          obstacle_min_range: 0.10
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # NAV-003 实车观察参数：缩小膨胀范围，并使代价在边界外更快衰减。
        # 未知区域不参与膨胀，避免在已完整建成的 nav002 地图中额外封闭通道。
        enabled: true
        cost_scaling_factor: 8.0
        inflation_radius: 0.18
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      # 首轮保留保守矩形安全包络
      footprint: "[[-0.20, -0.17], [-0.20, 0.17], [0.20, 0.17], [0.20, -0.17]]"
      footprint_padding: 0.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.00
          raytrace_min_range: 0.10
          obstacle_max_range: 3.00
          obstacle_min_range: 0.10
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 与局部代价地图保持完全一致，防止全局与局部路径对可通行空间的判断不一致。
        enabled: true
        cost_scaling_factor: 8.0
        inflation_radius: 0.18
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.10
      use_astar: false
      # 禁止穿越未知区域
      allow_unknown: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # 与 DWB 保持同一速度上限：前进 0.18 m/s，旋转 ±0.36 rad/s。
    # 仍禁止横移和倒车。
    max_velocity: [0.18, 0.0, 0.36]
    min_velocity: [0.0, 0.0, -0.36]
    max_accel: [0.20, 0.0, 0.40]
    max_decel: [-0.20, 0.0, -0.40]
    odom_topic: /wheel/odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # 输入超时设为 0.20 s（底盘命令超时为 0.30 s）
    velocity_timeout: 0.20

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['map_server', 'amcl']

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['controller_server', 'velocity_smoother', 'planner_server', 'bt_navigator']
