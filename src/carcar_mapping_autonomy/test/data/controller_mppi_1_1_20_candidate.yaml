# 离线候选，Humble 1.1.20 CPU实现；正式入口暂不加载。
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 30
      model_dt: 0.10
      batch_size: 1000
      vx_std: 0.08
      vy_std: 0.0
      wz_std: 0.25
      vx_max: 0.10
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.36
      iteration_count: 1
      prune_distance: 1.2
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      regenerate_noises: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.3
        trajectory_point_step: 1
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.6
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.25
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 1
        threshold_to_consider: 0.25
        offset_from_furthest: 5
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.3
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.25
        max_angle_to_furthest: 0.5
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.25
