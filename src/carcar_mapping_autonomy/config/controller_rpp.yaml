controller_server:
  ros__parameters:
    FollowPath:
      # NAV-018-R5：保留DWB配置作对照；实验自动建图使用本机Humble 1.1.20 RPP。
      # 近距离反向路径先转向再跟随，避免已复现的DWB返程停滞；禁止倒车。
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.10
      lookahead_dist: 0.30
      # Humble以carrot距离判断末端转向，必须大于general_goal_checker的0.15m容差。
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.30
      # 候选前视范围0.20～0.30m，降低门口直角转弯切角；速度及足迹门槛保持。
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.36
      # 内部可行速度计算采用Humble默认候选，避免与基于实测速度的限幅重复卡住。
      # 最终velocity_smoother仍限0.80rad/s²及0.36rad/s；R10实车6点及返程验证，仍属实验配置。
      max_angular_accel: 3.20
      allow_reversing: false
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.30
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.30
      regulated_linear_scaling_min_speed: 0.02
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
