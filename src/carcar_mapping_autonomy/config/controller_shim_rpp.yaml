# 离线候选：先加载controller_rpp.yaml，再覆盖本文件；通过完整门槛后才允许选入发布。
controller_server:
  ros__parameters:
    FollowPath:
      plugin: carcar_mapping_autonomy::MappingRotationShim
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      use_rotate_to_heading: false
      angular_dist_threshold: 0.50
      angular_disengage_threshold: 0.10
      forward_sampling_distance: 0.30
      rotate_to_goal_heading: true
      closed_loop: true
      simulate_ahead_time: 1.0
