/mapping/relocalizer/amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    tf_broadcast: false
    map_topic: /mapping/recovery/reference_map
    scan_topic: /mapping/recovery/scan
    first_map_only: false
    always_reset_initial_pose: true
    min_particles: 500
    max_particles: 2000
    max_beams: 90
    # 静止旁路使用逐束概率乘积，避免平行墙的多数回波掩盖少量不一致特征。
    laser_model_type: likelihood_field_prob
    laser_likelihood_max_dist: 0.5
    laser_min_range: 0.15
    # 使用恢复节点按SLAM实际max_laser_range裁剪后的扫描上限。
    laser_max_range: -1.0
    z_hit: 0.95
    z_rand: 0.05
    sigma_hit: 0.10
    do_beamskip: false
    pf_err: 0.02
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.01
    update_min_a: 0.01
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    transform_tolerance: 0.2
    # Humble内部会计算1/rate，0会导致无限Duration并拒绝configure。
    save_pose_rate: 0.5
