board_closed_loop_test_driver:
  ros__parameters:
    serial_port: /dev/myserial
    # MOTOR-015 地面候选：控制板内部执行四路编码器 PID。
    car_type: 1
    drive_mode: board_motion_pid
    holonomic: true
    publish_rate: 25.0
    command_timeout: 0.3
    # 分级地面验收上限；键盘 9 档最高 0.45 m/s，此处留余量。
    max_linear_x: 0.50
    max_linear_y: 0.50
    max_angular_z: 1.20
    base_frame: base_footprint
    odom_frame: board_closed_loop_ground_test_odom
    imu_frame: imu_link
    publish_odom_tf: false
    battery_min_voltage: 9.6
    battery_max_voltage: 12.6
    debug_serial: false
    # RQT 暂存值；motion_pid_apply=true 时才临时写入控制板，绝不写 Flash。
    # 当前 Flash 基准（2026-09-08 实机调参确定）。
    motion_kp: 8.0
    motion_ki: 1.2
    motion_kd: 0.8
    motion_pid_apply: false
