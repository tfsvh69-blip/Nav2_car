two_motor_test:
  ros__parameters:
    serial_port: /dev/myserial
    # 第一次架空测试限制在 20%，确认方向后再逐步提高。
    max_pwm_percent: 20
    # teleop_twist_keyboard 默认前进速度是 0.5 m/s，对应上述 PWM 上限。
    linear_full_scale: 0.5
    angular_full_scale: 1.0
    motor_1_sign: 1
    motor_2_sign: 1
    # 当前只测前进/后退，忽略 cmd_vel.angular.z。
    enable_steering: false
    # teleop 每次按键只发一帧，0.6 秒后自动停车。
    command_timeout: 0.6
    watchdog_rate: 20.0
