board_closed_loop_test_driver:
  ros__parameters:
    serial_port: /dev/myserial
    # 仅用于 MOTOR-010：该值随 set_car_motion 指令发送，不调用会写 Flash 的 set_car_type()。
    car_type: 2
    drive_mode: board_motion_pid
    holonomic: true
    publish_rate: 25.0
    command_timeout: 0.3
    max_linear_x: 0.08
    max_linear_y: 0.08
    max_angular_z: 0.40
    base_frame: base_footprint
    odom_frame: board_closed_loop_x3plus_probe_odom
    imu_frame: imu_link
    publish_odom_tf: false
    battery_min_voltage: 9.6
    battery_max_voltage: 12.6
    debug_serial: false
