rosmaster_base:
  ros__parameters:
    serial_port: /dev/myserial
    # Yahboom: X3=1, X3 Plus=2, X1=4, R2=5
    car_type: 1
    holonomic: true
    publish_rate: 25.0
    command_timeout: 0.5
    max_linear_x: 0.5
    max_linear_y: 0.5
    max_angular_z: 2.0
    base_frame: base_footprint
    odom_frame: odom
    imu_frame: imu_link
    # 后续由 robot_localization 唯一发布 odom TF；底盘调试时可临时改为 true。
    publish_odom_tf: false
    battery_min_voltage: 9.6
    battery_max_voltage: 12.6
    debug_serial: false

