rosmaster_base:
  ros__parameters:
    serial_port: /dev/myserial
    # Yahboom: X3=1, X3 Plus=2, X1=4, R2=5
    car_type: 1
    # 正式底盘只使用控制板内置运动 PID；不通过本节点发送逐轮 PWM。
    drive_mode: board_motion_pid
    # 整车带载较重，麦轮微型辊子受压滚动受阻；底盘退化为成熟稳定的差速非全向模式，禁用横移。
    holonomic: false
    publish_rate: 25.0
    command_timeout: 0.3
    # 地面闭环标定完成前采用保守限速，实测通过后再逐级提高。
    max_linear_x: 0.15
    max_linear_y: 0.0
    max_angular_z: 0.8
    base_frame: base_footprint
    odom_frame: odom
    imu_frame: imu_link
    # IMU 轴向符号校正 [x, y, z]；ROS REP-103 约定右手系逆时针 gz>0，静止 az>0。
    # 2026-09-08 实测原厂库解析 MPU9250 时对 gz 乘以 -gyro_ratio 导致输出反向，az 同为负值。
    imu_gyro_signs: [1, 1, -1]
    imu_accel_signs: [1, 1, -1]
    # 纯轮式 Odom 验收（ODOM-001）于 2026-09-08 实测通过，由本节点发布 odom TF。
    publish_odom_tf: true
    # 纯轮式编码器 Odom 已正式启用。
    wheel_odometry_enabled: true
    wheel_diameter_m: 0.060
    wheelbase_m: 0.120
    track_width_m: 0.185
    wheel_counts_per_revolution: [1319.2, 1317.9, 1319.2, 1319.2]
    # +1 表示该端口的原始正计数等于该物理轮使车体前进的方向；2026-09-08 实测全为 +1。
    wheel_encoder_signs: [1, 1, 1, 1]
    # 现有闭环接线：M1=左前、M2=左后、M3=右前、M4=右后。
    wheel_port_wheels: [left_front, left_rear, right_front, right_rear]
    # 防止控制板重启/通信异常造成单周期大跳变污染位姿。
    wheel_odom_max_count_delta: 100000
    battery_min_voltage: 9.6
    battery_max_voltage: 12.6
    debug_serial: false
    # RQT 暂存值；motion_pid_apply=true 时才临时写入控制板，绝不写 Flash。
    motion_kp: 8.0
    motion_ki: 1.2
    motion_kd: 0.8
    motion_pid_apply: false
