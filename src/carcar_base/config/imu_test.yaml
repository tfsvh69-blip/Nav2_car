imu_test_driver:
  ros__parameters:
    serial_port: /dev/myserial
    # Yahboom: X3=1, X3 Plus=2, X1=4, R2=5
    car_type: 1
    drive_mode: board_motion_pid
    holonomic: false
    publish_rate: 25.0
    command_timeout: 0.3
    # IMU 测试期间速度上限严格设为零，防止意外运动指令
    max_linear_x: 0.0
    max_linear_y: 0.0
    max_angular_z: 0.0
    base_frame: base_footprint
    odom_frame: odom
    imu_frame: imu_link
    # IMU 轴向符号校正 [x, y, z]；ROS REP-103 约定右手系逆时针 gz>0，静止 az>0。
    imu_gyro_signs: [1, 1, -1]
    imu_accel_signs: [1, 1, -1]
    # 隔离测试期间关闭轮式里程计解算与 TF 发布
    publish_odom_tf: false
    wheel_odometry_enabled: false
    wheel_diameter_m: 0.060
    wheelbase_m: 0.120
    track_width_m: 0.185
    wheel_counts_per_revolution: [1319.2, 1317.9, 1319.2, 1319.2]
    wheel_encoder_signs: [1, 1, 1, 1]
    wheel_port_wheels: [left_front, left_rear, right_front, right_rear]
    wheel_odom_max_count_delta: 100000
    battery_min_voltage: 9.6
    battery_max_voltage: 12.6
    debug_serial: false
    motion_kp: 8.0
    motion_ki: 1.2
    motion_kd: 0.8
    motion_pid_apply: false

