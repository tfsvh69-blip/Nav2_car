# 独立诊断的近低/远高共享标障点云候选；两路范围/高度由Costmap分别约束。
# 输出保留2 m、1.5 cm以上输入；近路只用0.85 m，远路只用5 cm以上。
# 不代表2 m内均能避开2 cm物体，也不能用来验收1.2 m低物体。
depth_cloud_filter:
  ros__parameters:
    base_frame: base_footprint
    input_topic: /camera/depth/points
    min_range: 0.30
    max_range: 2.00
    max_clearing_range: 2.00
    min_obstacle_height: 0.015
    max_obstacle_height: 0.26
    self_min_x: -0.14
    self_max_x: 0.14
    self_min_y: -0.13
    self_max_y: 0.13
    self_min_z: 0.00
    self_max_z: 0.26
    max_stamp_age_s: 0.50
    transform_timeout_s: 0.10
    temporal_confirm_enable: false
