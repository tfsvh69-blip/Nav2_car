# 2026-10-05：仅近距静止2 cm低障碍试验；未实机验收，禁止替换正式默认。
# max_range是相机光心斜距；0.85 m只作本轮近距候选，不代表导航探测距离已达标。
# 保留2 m清障端点及0.50 s新鲜度门槛；不叠加时间确认。
depth_cloud_filter:
  ros__parameters:
    base_frame: base_footprint
    input_topic: /camera/depth/points
    min_range: 0.30
    max_range: 0.85
    max_clearing_range: 2.00
    min_obstacle_height: 0.01
    max_obstacle_height: 0.26
    self_min_x: -0.14
    self_max_x: 0.14
    self_min_y: -0.13
    self_max_y: 0.13
    self_min_z: 0.00
    self_max_z: 0.26
    max_stamp_age_s: 0.50
    transform_timeout_s: 0.10
    temporal_confirm_enable: false
