# 静止清障候选：障碍仍限 2 m；仅有效背景清障点允许到 4 m，未作为默认。
depth_cloud_filter:
  ros__parameters:
    base_frame: base_footprint
    input_topic: /camera/depth/points
    min_range: 0.30
    max_range: 2.00
    max_clearing_range: 4.00
    min_obstacle_height: 0.03
    max_obstacle_height: 0.26
    self_min_x: -0.14
    self_max_x: 0.14
    self_min_y: -0.13
    self_max_y: 0.13
    self_min_z: 0.00
    self_max_z: 0.26
    max_stamp_age_s: 0.50
    transform_timeout_s: 0.10

depth_layer_supervisor:
  ros__parameters:
    health_timeout_s: 0.50
    recovery_stable_s: 3.0
    rebuild_wait_s: 1.0
    switch_timeout_s: 5.0
    layer_parameter: depth_voxel_layer.enabled
    status_frame: base_link
