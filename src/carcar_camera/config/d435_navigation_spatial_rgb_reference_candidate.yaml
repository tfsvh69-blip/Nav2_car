# NAV-016-R2 独立静止空间滤波候选；相对RGB参照候选仅开启SDK Spatial。
# librealsense 2.58.4 / realsense-ros 4.58.3，Apache-2.0。
# 两次边缘保持平滑，内部补洞关闭；不历史补帧、不降采样、不改变TF/TTL。
# 会影响深度图及标障/清障输入；小目标、边缘与撤障仍待实机验收。
/**:
  ros__parameters:
    camera_name: camera
    serial_no: "213222078719"
    device_type: "d435"
    enable_depth: true
    enable_color: true
    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    depth_module.depth_profile: "640x480x6"
    depth_module.depth_format: "Z16"
    rgb_camera.color_profile: "640x480x6"
    rgb_camera.color_format: "RGB8"
    pointcloud.enable: true
    pointcloud.stream_filter: 0
    pointcloud.stream_index_filter: 0
    pointcloud.ordered_pc: false
    pointcloud.allow_no_texture_points: true
    pointcloud__neon_.enable: true
    pointcloud__neon_.stream_filter: 0
    pointcloud__neon_.stream_index_filter: 0
    pointcloud__neon_.ordered_pc: false
    pointcloud__neon_.allow_no_texture_points: true
    publish_tf: true
    tf_publish_rate: 0.0
    diagnostics_period: 1.0
    reconnect_timeout: 6.0
    initial_reset: false
    align_depth.enable: false
    colorizer.enable: false
    spatial_filter.enable: true
    spatial_filter.filter_magnitude: 2
    spatial_filter.filter_smooth_alpha: 0.5
    spatial_filter.filter_smooth_delta: 20
    spatial_filter.holes_fill: 0
    temporal_filter.enable: false
    hole_filling_filter.enable: false
