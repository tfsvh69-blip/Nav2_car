/controller_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 0.3
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      desired_linear_vel: 0.1
      inflation_cost_scaling_factor: 5.0
      lookahead_dist: 0.3
      lookahead_time: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 3.2
      max_lookahead_dist: 0.3
      max_robot_pose_search_dist: 1.4875
      min_approach_linear_velocity: 0.02
      min_lookahead_dist: 0.2
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.3
      regulated_linear_scaling_min_speed: 0.02
      rotate_to_heading_angular_vel: 0.22
      rotate_to_heading_min_angle: 0.1
      transform_tolerance: 0.2
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      use_interpolation: true
      use_regulated_linear_velocity_scaling: true
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: true
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    exploration_goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
    failure_tolerance: 0.5
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.175
    goal_checker_plugins:
    - general_goal_checker
    - exploration_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    odom_topic: /wheel/odometry
    progress_checker:
      movement_time_allowance: 30.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
    progress_checker_plugin: progress_checker
    publish_zero_velocity: true
    speed_limit_topic: speed_limit
    use_sim_time: false

