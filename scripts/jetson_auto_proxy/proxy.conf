# 仅监听127.0.0.1；默认网关候选按路由metric排序，先于固定候选。
listen_port=17892
auto_gateways=1
probe_url=https://api.openai.com/v1/models
probe_timeout_ms=9000
probe_interval_ms=15000
probe_failure_threshold=3
cooldown_ms=3000
connect_timeout_ms=5000
max_clients=48
# 固定候选优先使用当前台式机LAN，SSH隧道作后备；换网后核对DHCP地址。
upstream=Windows_DigiLink_LAN 192.168.5.72 23292
upstream=Windows_SSH_Tunnel 127.0.0.1 17893
upstream=Windows_DigiLink 192.168.5.17 23292
upstream=Ubuntu_proxy 192.168.5.17 7892
upstream=Laptop_fallback 192.168.5.36 7892
